[project]
name = "gsi-inundation-estimate-kita-inbanuma-jp"
version = "0.1.0"
description = "GSI inundation estimate (Kita-Inbanuma, Typhoon No. 25 of Reiwa 8): reproducible collection"
requires-python = ">=3.11"
dependencies = ["pyarrow>=17", "duckdb>=1.5.5", "geopandas", "shapely>=2", "pyproj", "matplotlib", "huggingface_hub>=0.25", "pyyaml"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
